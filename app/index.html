<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>돈구리</title>
  <meta name="description" content="살까 말까 고민될 때 3초 만에 결과를 보여 주는 10대 용돈 앱">
  <meta name="theme-color" content="#F2F4F7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="돈구리">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="stage-wrap">
    <aside class="demo-panel" aria-label="시연 도구">
      <div>
        <h1>돈구리</h1>
        <p>살까 말까, 돈구리에게 3초.</p>
      </div>
      <div class="card">
        <b>시연 도구</b>
        <p class="small">발표할 때 이 버튼으로 하루를 넘기며 보류한 고민이 돌아오는 장면을 보여 주세요.</p>
        <button class="btn line block" data-act="demo-load">시연 데이터 불러오기</button>
        <button class="btn primary block" data-act="demo-next">하루 넘기기</button>
        <button class="btn text" data-act="ask-reset">처음부터 다시 하기</button>
      </div>
      <div class="card small">
        <b>3분 시연 순서</b>
        <p>① 홈의 "살까 말까?" → 마라탕 ② 판단 카드: 사면 이어폰 3일 늦어짐 ③ "내일 다시 볼래" ④ 하루 넘기기 → "아직 먹고 싶어?" → "이제 괜찮아" ⑤ 은행잎이 나무로, 어린 나무로 자람 ⑥ 기록 탭의 이번 주 고민</p>
      </div>
    </aside>
    <div class="phone" aria-live="off"></div>
  </div>
  <noscript>돈구리는 자바스크립트가 켜져 있어야 동작해요.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
